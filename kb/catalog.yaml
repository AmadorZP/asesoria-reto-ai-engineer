# Catalogo de la base de conocimiento de AsesorIA.
# Criterios de seleccion:
#   1. Fuente primaria y publica (regulador o emisor).
#   2. Version vigente mas reciente por emisor y tipo de documento.
#   3. Cobertura guiada por los escenarios de uso: riesgos de emisores, ETF de bonos,
#      perfiles de riesgo e idoneidad.
#   4. Diversidad de formato e idioma (HTML iXBRL, PDF, web; ingles y espanol).
#   5. Corpus pequeno y curado, con metadatos completos, antes que grande y ruidoso.
# Las politicas internas simuladas se generan desde kb/policies/politicas.yaml.

